# Blueprint de Render para Matteo Masas.
#
# El codigo vive dentro de la estructura de entrega del capstone, por eso se
# define rootDir. El servidor Express sirve tambien la carpeta frontend/.
#
# Las variables con sync: false se completan a mano en el dashboard de Render.

services:
  - type: web
    name: matteo-masas
    runtime: node
    plan: free
    rootDir: "Fase 2/Evidencias Proyecto/Evidencias de Sistema"
    buildCommand: cd backend && npm ci --omit=dev
    startCommand: cd backend && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # El hosting corre en UTC; la tienda calcula las fechas de entrega con la
      # hora local, por eso se fija la zona horaria de Chile.
      - key: TZ
        value: America/Santiago
      - key: TRUST_PROXY
        value: "1"
      - key: WEBPAY_ENVIRONMENT
        value: integration
      - key: WEBPAY_EXPIRA_MINUTOS
        value: "60"
      - key: ABONO_TRANSFERENCIA_EXPIRA_HORAS
        value: "24"
      - key: DB_POOL_MAX
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # Correo transaccional (código del pedido y avisos de estado).
      # Si no se configura, los correos se omiten y la tienda sigue igual.
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
